<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog Studenți</title>
    <style>
        /* Resetare și stiluri de bază */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            max-width: 500px; 
            margin: 40px auto; 
            padding: 20px; 
            color: #333;
        }

        /* Titluri centrate și simple */
        h1 { text-align: center; margin-bottom: 40px; font-weight: 600; }
        h3 { margin-bottom: 15px; font-weight: 500; color: #555; }

        /* Formular minimalist - fără fundal gri */
        form { margin-bottom: 40px; }
        
        input { 
            display: block; 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            border: 1px solid #ddd; 
            border-radius: 4px; 
            box-sizing: border-box; /* Asigură că padding-ul nu strică lățimea */
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #28a745;
            outline: none;
        }

        button { 
            background: #28a745; 
            color: white; 
            padding: 12px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 16px; 
            font-weight: 500;
        }

        button:hover { background: #218838; }

        /* Stilul listei - curat, doar cu linii de separare */
        .student-card { 
            padding: 15px 0; 
            border-bottom: 1px solid #eee; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .student-card:last-child { border-bottom: none; }
        
        /* Linie orizontală subtilă */
        hr { border: 0; border-top: 1px solid #eee; margin: 30px 0; }
    </style>
</head>
<body>

    <h1>Catalog Studenți</h1>

    <form id="formStudent">
        <h3>Adaugă Student</h3>
        <input type="text" id="nume" placeholder="Numele studentului" required>
        <input type="number" id="an" placeholder="Anul de studiu (1-4)" min="1" max="4" required>
        <input type="number" id="media" placeholder="Media generală" step="0.01" min="1" max="10" required>
        <button type="submit">Salvează</button>
    </form>

    <hr>

    <h3>Lista Studenți</h3>
    <div id="listaStudenti">
        <p style="color: #888;">Se încarcă datele...</p>
    </div>

    <script>
        // Funcția care încarcă studenții (GET)
        function incarcaStudenti() {
            fetch('api.php') 
                .then(response => response.json())
                .then(data => {
                    const listaDiv = document.getElementById('listaStudenti');
                    listaDiv.innerHTML = ''; 

                    if (data.length === 0) {
                        listaDiv.innerHTML = '<p style="color: #888;">Nu există studenți în baza de date.</p>';
                        return;
                    }

                    data.forEach(student => {
                        const div = document.createElement('div');
                        div.className = 'student-card';
                        // Am simplificat puțin și afișarea textului
                        div.innerHTML = `
                            <span><strong>${student.nume}</strong></span>
                            <span style="color: #666;">Anul ${student.an} • Media: <strong>${student.media}</strong></span>
                        `;
                        listaDiv.appendChild(div);
                    });
                })
                .catch(err => console.error('Eroare fetch:', err));
        }

        // Evenimentul de trimitere a formularului (POST)
        document.getElementById('formStudent').addEventListener('submit', function(e) {
            e.preventDefault(); 

            const studentNou = {
                nume: document.getElementById('nume').value,
                an: document.getElementById('an').value,
                media: document.getElementById('media').value
            };

            fetch('api.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(studentNou)
            })
            .then(response => response.json())
            .then(result => {
                if(result.status === 'success') {
                    document.getElementById('formStudent').reset();
                    incarcaStudenti(); 
                } else {
                    alert('Eroare: ' + result.message);
                }
            })
            .catch(err => console.error('Eroare adăugare:', err));
        });

        incarcaStudenti();
    </script>

</body>
</html>
