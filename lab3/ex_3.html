<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex3</title>
</head>
<body>
    <script>
        let a=15, b=4, c=12;
        if (a >= b && a >= c) {
            if (b >= c) {
                console.log(`${a}, ${b}, ${c}`); 
            } else {
                console.log(`${a}, ${c}, ${b}`); 
            }
        }
        else if (b >= a && b >= c) {
            if (a >= c) {
                console.log(`${b}, ${a}, ${c}`); 
            } else {
                console.log(`${b}, ${c}, ${a}`); 
            }
        } 
        else if (c >= a && c >= b) {
            if (a >= b) {
                console.log(`${c}, ${a}, ${b}`); 
            } else {
                console.log(`${c}, ${b}, ${a}`); 
            }
        }
    </script>
</body>
</html>
